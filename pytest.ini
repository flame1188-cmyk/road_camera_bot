[pytest]
# ===========================================================
# GIBDD Stat Bot — pytest configuration
# ===========================================================
# Запуск:        pytest
# Подробный:     pytest -v
# Один файл:     pytest tests/unit/test_analytics_metrics.py
# С покрытием:   pytest --cov=gibdd-bot
# Без slow:      pytest -m "not slow"
# Только smoke:  pytest -m smoke
# ===========================================================

asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Строгие маркеры — неизвестный маркер = ошибка.
# Предотвращает опечатки вроде @pytest.mark.assync.
strict_markers = true

# Базовые опции: показывать краткий summary упавших,_coverage report.
addopts =
    -ra
    --strict-markers
    --cov=analytics
    --cov=user_request_parser
    --cov=gibdd_parser
    --cov=llm_analyzer
    --cov=backend.telegram_auth
    --cov=backend.services.gibdd_service
    --cov-report=term-missing
    --cov-report=html:tests/_coverage_html
    --cov-fail-under=40

# Зарегистрированные маркеры.
markers =
    slow: тесты дольше 1 секунды (запускать отдельно в CI)
    integration: требуют БД или внешние сервисы (ГИБДД/aitunnel)
    golden: replay захваченных ответов LLM, без сети
    smoke: быстрые проверки живости прод-эндпоинтов (раз в час в CI)

# Фильтр предупреждений:
# - AST-предупреждения от lib2to3 и пр. не валим вывод.
# - "coroutine never awaited" от create_task в тестах — известный noise
#   при патче save_task, не влияет на корректность тестов.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore:coroutine '.*' was never awaited:RuntimeWarning
