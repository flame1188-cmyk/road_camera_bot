# ============================================================
# Nginx конфигурация для production (TLS termination + reverse proxy)
#
# Установка:
#   1. sudo cp nginx.conf /etc/nginx/sites-available/gibdd-miniapp.conf
#   2. sudo ln -s /etc/nginx/sites-available/gibdd-miniapp.conf /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d yourdomain.ru
#   4. sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Ограничение размера тела запроса (для загрузки реестра камер через Mini App)
client_max_body_size 50M;

# Сжатие
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# Rate limiting (защита от злоупотреблений)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

upstream gibdd_miniapp {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name yourdomain.ru;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.ru;

    # TLS сертификаты (после certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.telegram.org; frame-src 'self' https://web.telegram.org;" always;

    # Логи
    access_log /var/log/nginx/gibdd-miniapp-access.log;
    error_log /var/log/nginx/gibdd-miniapp-error.log;

    # === API ===
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://gibdd_miniapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Таймауты для долгих выгрузок
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # === Health check ===
    location /health {
        proxy_pass http://gibdd_miniapp;
        access_log off;
    }

    # === Документация API (закрыть в production) ===
    location /docs {
        # return 404;  # Раскомментировать в production
        proxy_pass http://gibdd_miniapp;
    }
    location /redoc {
        # return 404;
        proxy_pass http://gibdd_miniapp;
    }

    # === Frontend (статика) ===
    location / {
        proxy_pass http://gibdd_miniapp/app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Кэш статики ===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://gibdd_miniapp;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
